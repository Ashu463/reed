[project]
name = "reed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashu463", email = "ashukasaudhan971@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
reed = "reed:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
